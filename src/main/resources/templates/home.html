<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Eum-SSO - Home</title>
    <style>
        body { font-family: sans-serif; background-color: #f5f5f5; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: auto; background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .user-info { margin-top: 1.5rem; padding: 1.5rem; background-color: #e9ecef; border-radius: 4px; }
        .user-info p { margin: 0.5rem 0; }
        .logout-form { margin-top: 2rem; }
        .btn-logout { padding: 0.8rem 1.5rem; border: none; border-radius: 4px; background-color: #dc3545; color: white; font-size: 1rem; cursor: pointer; }
        .btn-logout:hover { background-color: #c82333; }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome to Eum-SSO</h1>
    <p>You have successfully logged in.</p>

    <!-- sec:authentication을 사용하여 인증된 사용자 정보에 직접 접근 -->
    <div class="user-info" sec:authorize="isAuthenticated()">
        <h2>Your Information</h2>
        <p><strong>User ID:</strong> <span sec:authentication="name"></span></p>
        <p><strong>Authorities:</strong> <span sec:authentication="principal.authorities"></span></p>
    </div>

    <form class="logout-form" th:action="@{/logout}" method="post">
        <button type="submit" class="btn-logout">Logout</button>
    </form>
</div>
</body>
</html>
