<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eum-SSO Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f5f5f5; }
        .login-container { background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 0.9rem; border: none; border-radius: 4px; background-color: #007bff; color: white; font-size: 1rem; cursor: pointer; }
        .btn:hover { background-color: #0056b3; }
        .alert { padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .register-link { text-align: center; margin-top: 1rem; }
        .register-link a { color: #007bff; text-decoration: none; }
        .user-info { margin-top: 2rem; padding: 1rem; background-color: #e9ecef; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>
<div class="login-container">
    <h1>Eum-SSO</h1>

    <!-- 로그인 에러 메시지 -->
    <div th:if="${param.error}" class="alert alert-danger">
        사용자 ID 또는 비밀번호가 올바르지 않습니다.
    </div>

    <!-- 로그아웃 성공 메시지 -->
    <div th:if="${param.logout}" class="alert alert-success">
        성공적으로 로그아웃되었습니다.
    </div>

    <!-- 회원가입 성공 메시지 -->
    <div th:if="${registrationSuccess}" class="alert alert-success">
        성공적으로 등록되었습니다. 이제 로그인할 수 있습니다.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">User ID</label>
            <input type="text" id="username" name="username" placeholder="Enter your User ID" required autofocus />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn">Login</button>
    </form>

    <div class="register-link">
        <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
    </div>

    <!-- 로그인 성공 정보 표시 -->
    <div th:if="${loginUserId}" class="user-info">
        <h4>Login Information</h4>
        <p><strong>User ID:</strong> <span th:text="${loginUserId}"></span></p>
        <p><strong>Roles:</strong> <span th:text="${loginUserRoles}"></span></p>
    </div>
</div>
</body>
</html>
