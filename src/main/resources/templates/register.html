<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Eum-SSO - Register</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f5f5f5; padding: 2rem 0; }
        .container { background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1, h2 { text-align: center; color: #333; }
        h2 { font-size: 1.2rem; color: #555; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; margin-bottom: 1.5rem; margin-top: 2rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #555; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"], select { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 0.9rem; border: none; border-radius: 4px; background-color: #28a745; color: white; font-size: 1rem; cursor: pointer; margin-top: 1rem; }
        .btn:hover { background-color: #218838; }
        .alert { padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .login-link { text-align: center; margin-top: 1rem; }
        .login-link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Account</h1>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        Error message will be shown here.
    </div>

    <form th:action="@{/register}" th:object="${signUpRequest}" method="post">

        <h2>User Information</h2>
        <div class="form-group">
            <label for="account">Account ID</label>
            <input type="text" id="account" th:field="*{account}" required autofocus />
        </div>
        <div class="form-group">
            <label for="username">Full Name</label>
            <input type="text" id="username" th:field="*{username}" required />
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" required />
        </div>
        <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="text" id="phoneNumber" th:field="*{phoneNumber}" required />
        </div>
        <div class="form-group">
            <label for="deptName">Department</label>
            <input type="text" id="deptName" th:field="*{deptName}" />
        </div>

        <h2>Organization Information</h2>
        <div class="form-group">
            <label for="orgType">Organization Type</label>
            <select id="orgType" th:field="*{orgType}" required>
                <option value="">Choose type...</option>
                <option value="PHARMA">PHARMA</option>
                <option value="CSO">CSO</option>
            </select>
        </div>
        <div class="form-group">
            <label for="bizName">Business Name</label>
            <input type="text" id="bizName" th:field="*{bizName}" required />
        </div>
        <div class="form-group">
            <label for="bizNumber">Business Number</label>
            <input type="text" id="bizNumber" th:field="*{bizNumber}" required />
        </div>
        <div class="form-group">
            <label for="repName">Representative Name</label>
            <input type="text" id="repName" th:field="*{repName}" required />
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" th:field="*{address}" required />
        </div>

        <button type="submit" class="btn">Register</button>
    </form>
    <div class="login-link">
        <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
    </div>
</div>
</body>
</html>
